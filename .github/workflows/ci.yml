name: LexTrace CI & Cloud Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-verify:
    name: 自动化构建、学术文献核验与测试
    runs-on: ubuntu-latest

    steps:
      - name: 检出私有仓库源码与知识库
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: 配置 Node.js 运行时 (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 配置 Python 3.11 运行时
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装 Python 依赖项
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 安装 Node 前端依赖
        run: npm ci || npm install

      - name: 验证学术知识库完整性 (538篇文献卡 + 448篇法规案例)
        run: |
          python -c "
          from pathlib import Path
          notes = list(Path('vault/知识产权/论文库').glob('*.md'))
          cases = list(Path('vault/知识产权/法律法规与典型案例').rglob('*.md'))
          print(f'✓ 论文库卡片总数: {len(notes)} 篇')
          print(f'✓ 法规与典型案例总数: {len(cases)} 篇')
          assert len(notes) >= 500, '论文库文件数量异常！'
          assert len(cases) >= 400, '法规案例库文件数量异常！'
          "

      - name: 运行自动化测试套件
        run: npm run test

      - name: 打包云端构建工件 (Cloud Build Artifacts)
        run: npm run build

      - name: 上传构建产物至 GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lextrace-cloud-dist
          path: dist/
          retention-days: 14
