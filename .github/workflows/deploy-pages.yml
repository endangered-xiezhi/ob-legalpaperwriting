name: Deploy LexTrace to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# 设置 GITHUB_TOKEN 权限以允许部署到 GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 允许一个并发部署，跳过进行中的运行
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: 检出源码与知识库
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: 配置 Node.js 运行时 (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 配置 Python 3.11 运行时
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装 Python 依赖项 (若存在)
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 安装 Node 前端依赖项
        run: npm ci || npm install

      - name: 编译构建前端静态资源 (Build dist/client)
        run: npm run build

      - name: 适配 GitHub Pages 静态路径与防 Jekyll 过滤
        run: |
          # 1. 创建 .nojekyll 防止 GitHub Pages 默认 Jekyll 引擎过滤 _next 目录
          touch dist/client/.nojekyll
          
          # 2. 适配 GitHub Pages 仓库二级路径 (/ob-legalpaperwriting/)
          node -e '
            const fs = require("fs");
            const files = ["dist/client/index.html", "dist/client/404.html"];
            for (const f of files) {
              if (fs.existsSync(f)) {
                let c = fs.readFileSync(f, "utf8");
                c = c.replace(/href="\/_next\//g, "href=\"/ob-legalpaperwriting/_next/");
                c = c.replace(/src="\/_next\//g, "src=\"/ob-legalpaperwriting/_next/");
                c = c.replace(/href="\/favicon\.svg"/g, "href=\"/ob-legalpaperwriting/favicon.svg\"");
                c = c.replace(/href="\/file\.svg"/g, "href=\"/ob-legalpaperwriting/file.svg\"");
                c = c.replace(/href="\/globe\.svg"/g, "href=\"/ob-legalpaperwriting/globe.svg\"");
                c = c.replace(/href="\/window\.svg"/g, "href=\"/ob-legalpaperwriting/window.svg\"");
                fs.writeFileSync(f, c, "utf8");
                console.log("✓ 成功注入 GitHub Pages 路径补丁:", f);
              }
            }
          '

      - name: 配置 GitHub Pages 环境
        uses: actions/configure-pages@v5

      - name: 上传构建产物至 Pages Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

      - name: 发布至 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
